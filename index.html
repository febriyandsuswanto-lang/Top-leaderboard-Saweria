<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Saweria Top 5</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  Pakai sebagai Browser Source / web widget, latar transparan. Ukuran bebas:
  tampilan otomatis menyesuaikan kotaknya (rasio ideal 222:45, mis. 444x90).
  Tanpa key  -> mode demo.
  Dengan key -> saweria-top5.html?key=STREAM_KEY
  Opsi: &period=all|year|month|week  &refresh=60 (detik, min 30)  &scale=2 (opsional, paksa skala tetap)
        &base=URL_PROXY/  &debug=1 (tampilkan status dan contoh respons)
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700&display=swap">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
#w{position:relative;width:222px;height:45px;transform-origin:0 0;font-family:'Inter',sans-serif;color:#F5F3FF}
.card{position:absolute;inset:0;box-sizing:border-box;overflow:hidden;border-radius:14px;padding:5px 0 0 12px;display:flex;flex-direction:column;gap:2px;
  background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04)),rgba(26,16,37,.62);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 24px rgba(10,6,24,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.acc{position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,#8B5CF6,rgba(139,92,246,0))}
.ttl{display:flex;align-items:center;gap:6px;height:13px;margin-right:14px;font:700 10.5px/1 'Plus Jakarta Sans',sans-serif}
.ttl .n{margin-left:auto;color:#C4B5FD;font:500 10px/1 'Inter',sans-serif}
.win{width:196px;height:24px;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%)}
.trk{display:flex;width:max-content;animation:scroll 28s linear infinite}
.c{position:relative;overflow:hidden;display:flex;align-items:center;gap:5px;height:20px;box-sizing:border-box;margin:2px 14px 0 0;white-space:nowrap}
.r{width:16px;height:16px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font:700 10px/1 'Inter',sans-serif;background:#2A1F3D;color:#F5F3FF}
.nm{max-width:110px;overflow:hidden;text-overflow:ellipsis;font:500 11px/1 'Inter',sans-serif}
.e .nm{color:#A99FBF}
.t{padding:0 9px 0 1px;border-radius:10px;border:1px solid rgba(var(--rgb),.9);background:rgba(var(--rgb),.2);animation:glow 2s ease-in-out infinite}
.t1{--rgb:56,189,248;--a:#7DD3FC;--b:#F0FAFF;--c:#38BDF8;--fg:#082F49}
.t2{--rgb:251,191,36;--a:#FBBF24;--b:#FFF3C4;--c:#F59E0B;--fg:#3B2200}
.t3{--rgb:203,213,225;--a:#CBD5E1;--b:#FFFFFF;--c:#94A3B8;--fg:#1E293B}
.t4,.t5{--rgb:205,127,50;--a:#E8A96B;--b:#E8A96B;--c:#CD7F32;--fg:#2B1706}
.t .r{background:linear-gradient(90deg,var(--b),var(--c),var(--b));background-size:200% 100%;color:var(--fg);animation:shine 2.6s linear infinite}
.t .nm{font-weight:600}
.t1 .r,.t2 .r,.t3 .r{animation:shine 2.6s linear infinite,pop 1.8s ease-in-out infinite}
.t1 .nm,.t2 .nm,.t3 .nm{font-weight:700;background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--b),var(--a));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 2.6s linear infinite}
.sw{position:absolute;top:0;bottom:0;left:-50%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 2.6s ease-in-out infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes shine{from{background-position:0% 0}to{background-position:200% 0}}
@keyframes sweep{0%{left:-50%}60%,100%{left:130%}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes glow{0%,100%{box-shadow:0 0 3px rgba(var(--rgb),.6),inset 0 0 5px rgba(var(--rgb),.35)}50%{box-shadow:0 0 8px rgba(var(--rgb),.95),inset 0 0 9px rgba(var(--rgb),.5)}}
#d{display:none;position:absolute;left:0;top:100px;margin:0;color:#fff;font:11px/1.3 monospace;white-space:pre-wrap;max-width:440px}
</style>
</head>
<body>
<div id="w">
  <div class="card">
    <span class="acc"></span>
    <div class="ttl">
      <!-- Logo Saweria: placeholder, ganti dengan logo resmi -->
      <svg width="12" height="12" viewBox="0 0 24 24" role="img" aria-label="Saweria"><circle cx="12" cy="12" r="11" fill="#FDBA74"/><path d="M15.5 8.5c-.8-1-2-1.5-3.5-1.5-2 0-3.5 1-3.5 2.6 0 3.6 7.2 1.9 7.2 5.6 0 1.7-1.6 2.8-3.7 2.8-1.6 0-3-.6-3.8-1.7" fill="none" stroke="#1A1025" stroke-width="2" stroke-linecap="round"/></svg>
      Saweria Top Supporter<span class="n">Top 10</span>
    </div>
    <div class="win"><div class="trk" id="trk"></div></div>
  </div>
</div>
<pre id="d"></pre>
<script>
const q = new URLSearchParams(location.search);
const KEY = q.get('key') || q.get('streamKey') || '';
const DEMO = q.get('demo') === '1' || !KEY;
const PERIOD = ['all', 'year', 'month', 'week'].includes(q.get('period')) ? q.get('period') : 'all';
const EVERY = Math.max(30, +q.get('refresh') || 60) * 1000;
const SCALE = +q.get('scale') || 0;
const DBG = q.get('debug') === '1';
const BASES = q.get('base') ? [q.get('base')] : ['https://backend.saweria.co/widgets/leaderboard/', 'https://api.saweria.co/widgets/leaderboard/'];
const NAME = ['donator_name', 'donatur', 'donator', 'name', 'username', 'display_name', 'from', 'supporter'];
const AMT = ['total', 'total_amount', 'amount', 'amount_total', 'nominal', 'sum', 'donation'];

function fit() {
  const W = innerWidth || document.documentElement.clientWidth, H = innerHeight || document.documentElement.clientHeight;
  const s = SCALE || (W && H ? Math.min(W / 222, H / 45) : 2);
  const w = document.getElementById('w');
  w.style.transform = 'scale(' + s + ')';
  w.style.left = Math.max(0, (W - 222 * s) / 2) + 'px';
  w.style.top = Math.max(0, (H - 45 * s) / 2) + 'px';
}
fit();
addEventListener('resize', fit);
if (DBG) { document.body.style.overflow = 'visible'; document.getElementById('d').style.display = 'block'; }
const dbg = (t) => { if (DBG) document.getElementById('d').textContent = t; };

const pick = (o, ks) => { for (const k of ks) if (o && o[k] != null && o[k] !== '') return o[k]; };
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

function findList(j, d) {
  d = d || 0;
  if (Array.isArray(j)) return j;
  if (j && typeof j === 'object' && d < 4) for (const k of Object.keys(j)) { const r = findList(j[k], d + 1); if (r && r.length) return r; }
  return null;
}

function norm(j) {
  const a = findList(j) || [];
  const l = a.filter(o => o && typeof o === 'object').map(o => {
    let name = pick(o, NAME), amt = pick(o, AMT);
    if (name == null) for (const k in o) if (typeof o[k] === 'string' && o[k] && !/^(https?:|[0-9a-f-]{20,}$)/i.test(o[k])) { name = o[k]; break; }
    if (amt == null) for (const k in o) if (typeof o[k] === 'number') { amt = o[k]; break; }
    return { name: String(name ?? '').trim(), amt: +amt || 0 };
  }).filter(x => x.name);
  l.sort((x, y) => y.amt - x.amt);
  return l.slice(0, 10);
}

function chip(it) {
  const c = el('div', it.e ? 'c e' : it.n <= 5 ? 'c t t' + it.n : 'c');
  c.append(el('span', 'r', it.n), el('span', 'nm', it.name));
  if (!it.e && it.n <= 5) { const s = el('span', 'sw'); s.style.animationDelay = (it.n * 0.35) + 's'; c.append(s); }
  return c;
}

let cur = [], last = '';
function render(list, force) {
  cur = list;
  const s = JSON.stringify(list);
  if (s === last && !force) return;
  last = s;
  const items = [];
  for (let i = 0; i < 10; i++) items.push(list[i] ? { n: i + 1, name: list[i].name } : { n: i + 1, name: 'Belum ada', e: 1 });
  const trk = document.getElementById('trk');
  trk.textContent = '';
  for (let k = 0; k < 2; k++) items.forEach(it => trk.appendChild(chip(it)));
  trk.style.animationDuration = Math.max(10, trk.scrollWidth / 2 / 30) + 's';
}

async function fetchLB() {
  let info = '';
  for (const B of BASES) {
    const u = B + PERIOD, h = B.split('/')[2] + ' ';
    const tries = [() => fetch(u + '?stream_key=' + encodeURIComponent(KEY)), () => fetch(u, { headers: { 'stream-key': KEY } })];
    for (const t of tries) {
      try {
        const r = await t();
        info += h + 'HTTP ' + r.status + ' | ';
        if (r.ok) return { j: await r.json(), info };
      } catch (e) { info += h + (e.message || e) + ' | '; }
    }
  }
  throw new Error(info);
}

async function tick() {
  try {
    const { j, info } = await fetchLB();
    render(norm(j));
    dbg(info + '\n' + JSON.stringify(j).slice(0, 400));
  } catch (e) { dbg('GAGAL: ' + e.message); }
}

if (DEMO) {
  render(['user01','user02','user03','user04','user05','user06','user07','user08','user09','user10'].map((n, i) => ({ name: '@' + n, amt: 10 - i })));
} else {
  render([]);
  tick();
  setInterval(tick, EVERY);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(cur, true));
</script>
</body>
</html>
